name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_ANSI: never
  CI_IMAGE: nudge-ci:${{ github.sha }}
  PROVIDER_MODE: fixture
  CJ_MODE: fixture
  RAILS_TEST_WORKERS: 1
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  tests:
    name: Test lanes and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development image
        run: docker compose build app

      - name: Verify development asset lifecycle
        run: docker compose run --rm --no-deps app ruby test/runtime/development_assets_contract.rb

      - name: Start database
        run: docker compose up --detach --wait db

      - name: Prepare test database
        run: docker compose run --rm --no-deps -e RAILS_ENV=test app bin/rails db:prepare

      - name: Run fast tests
        shell: bash
        run: |
          mkdir -p tmp/test-results
          set -o pipefail
          docker compose run --rm --no-deps -e RAILS_ENV=test -e RAILS_TEST_WORKERS app bin/test-fast 2>&1 | tee tmp/test-results/fast.log

      - name: Run integration and contract tests
        shell: bash
        run: |
          set -o pipefail
          docker compose run --rm --no-deps -e RAILS_ENV=test -e RAILS_TEST_WORKERS app bin/test-integration 2>&1 | tee tmp/test-results/integration.log

      - name: Enforce full-suite coverage
        shell: bash
        run: |
          set -o pipefail
          docker compose run --rm --no-deps -v "$PWD:/rails:ro" -e RAILS_ENV=test -e RAILS_TEST_WORKERS app bin/test-all 2>&1 | tee tmp/test-results/coverage.log

      - name: Export coverage artifact
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/test-results
          docker compose run --rm --no-deps app tar -C /coverage -czf - . > tmp/test-results/coverage.tar.gz

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            tmp/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser:
    name: Browser system tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER_COMPOSE_PROJECT: nudge-browser-${{ github.run_id }}-${{ github.run_attempt }}
      SYSTEM_TEST_ARTIFACTS_PATH: ./tmp/browser-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure browser artifact ownership
        shell: bash
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p tmp/browser-artifacts tmp/browser-results

      - name: Validate browser Compose configuration
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml --profile tools config --quiet

      - name: Build browser test images
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml --profile tools build system_app system_tests artifact_export

      - name: Start browser services
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml up --detach --wait db browser system_app

      - name: Verify browser application container contract
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml exec -T system_app ruby test/runtime/system_test_container_contract.rb /rails/log /rails/storage /rails/tmp /rails/app/assets/builds

      - name: Verify browser runner container contract
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml run --rm --no-deps system_tests ruby test/runtime/system_test_container_contract.rb /rails/log /rails/storage /rails/tmp /rails/app/assets/builds /coverage

      - name: Run browser system tests
        shell: bash
        run: |
          set -o pipefail
          docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml run --rm --no-deps system_tests bin/test-browser 2>&1 | tee tmp/browser-results/browser.log

      - name: Export browser evidence
        if: always()
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml --profile tools run --rm --no-deps artifact_export

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            tmp/browser-artifacts/
            tmp/browser-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down browser services
        if: always()
        run: docker compose -p "$BROWSER_COMPOSE_PROJECT" -f compose.yaml -f compose.system-test.yaml down --volumes --remove-orphans

  quality:
    name: Ruby quality and application security
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development image
        run: docker compose build app

      - name: Check Ruby style
        run: docker compose run --rm --no-deps app bin/rubocop

      - name: Audit Ruby dependencies
        run: docker compose run --rm --no-deps app bin/bundler-audit

      - name: Scan Rails application
        run: docker compose run --rm --no-deps app bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Tear down quality services
        if: always()
        run: docker compose down --volumes --remove-orphans

  production-security:
    name: Production build and security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --target runtime --tag "$CI_IMAGE" .

      - name: Verify production image contract
        run: docker run --rm -e RAILS_ENV=production -e SECRET_KEY_BASE_DUMMY=1 "$CI_IMAGE" ruby test/runtime/production_image_contract.rb

      - name: Scan repository configuration and secrets
        run: docker run --rm -v "$PWD:/workspace" "$TRIVY_IMAGE" fs --scanners secret,misconfig --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git /workspace

      - name: Export production image for scanning
        run: docker save --output /tmp/nudge-image.tar "$CI_IMAGE"

      - name: Scan production image vulnerabilities
        # Bundler Audit covers Ruby gems above. Limit this image scan to the
        # operating-system packages so Trivy never downloads its Java database.
        run: docker run --rm -v "/tmp:/scan" "$TRIVY_IMAGE" image --input /scan/nudge-image.tar --scanners vuln --pkg-types os --skip-java-db-update --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed

      - name: Tear down security services
        if: always()
        run: docker compose down --volumes --remove-orphans
